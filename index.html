<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>오정석 님의 페이지 입니다.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>오정석 님의 페이지 입니다.</h1>
  <div class="container">
    <form id="guestbook-form">
      <input type="text" id="nickname" placeholder="닉네임" required />
      <textarea id="message" placeholder="메시지를 입력하세요" required></textarea>
      <button type="submit">남기기</button>
    </form>
    <div id="messages"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBtazu-QkEd_iluZ0MRJNR5AbbYPQMQK2hs",
      authDomain: "guestbook-4f21b.firebaseapp.com",
      projectId: "guestbook-4f21b",
      storageBucket: "guestbook-4f21b.appspot.com",
      messagingSenderId: "327752784279",
      appId: "1:327752784279:web:7499b9cc7fbfee047b0cd2",
      measurementId: "G-YEX9WKMNCY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const form = document.getElementById("guestbook-form");
    const nicknameInput = document.getElementById("nickname");
    const messageInput = document.getElementById("message");
    const messagesDiv = document.getElementById("messages");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nickname = nicknameInput.value.trim();
      const message = messageInput.value.trim();
      if (!nickname || !message) return;
      await db.collection("messages").add({
        nickname,
        message,
        timestamp: new Date()
      });
      nicknameInput.value = "";
      messageInput.value = "";
    });

    db.collection("messages").orderBy("timestamp", "desc").onSnapshot(snapshot => {
      messagesDiv.innerHTML = "";
      snapshot.forEach(doc => {
        const data = doc.data();
        const el = document.createElement("div");
        el.classList.add("message");
        el.innerHTML = `<strong>${data.nickname}</strong><br/>${data.message}`;
        messagesDiv.appendChild(el);
      });
    });
  </script>
</body>
</html>
